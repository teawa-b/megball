<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MEGABALL — Pinball Tower Defense</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="description" content="A tower defense game played on a vertical pinball table.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  /* Fixed portrait, no scrolling, no browser gestures stealing input. */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05060d; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  #stage { position: fixed; inset: 0; display: block; }
  #gl, #game { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #gl { z-index: 0; } #game { z-index: 1; }

  /* Boot splash: also the gesture that unlocks Web Audio on mobile. It is
     the machine powering up: a ball and two flippers under glass, the name
     on a dot-matrix display, and a chase of attract lamps. Only transform
     and opacity animate, so the compositor keeps them moving while the main
     thread compiles shaders behind it. */
  #boot {
    position: fixed; inset: 0; z-index: 40; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    background: #05060d; color: #fff; transition: opacity .45s; text-align: center;
    overflow: hidden;
  }
  #boot::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(60% 40% at 50% 42%, rgba(63,224,255,.10), transparent 70%),
      radial-gradient(circle, rgba(63,224,255,.10) 1px, transparent 1.6px) 0 0 / 14px 14px;
  }
  #boot::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
      radial-gradient(80% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.8) 100%);
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  /* Height is load-bearing: the ball's drop keyframe lands exactly on the
     flipper faces, so changing it opens a gap between them. */
  #boot .play { position: relative; width: min(62vw, 236px); height: 150px; z-index: 1; }
  #boot .flip {
    position: absolute; bottom: 30px; width: 78px; height: 18px; border-radius: 9px;
    background: linear-gradient(180deg, #8fe8ff, #3fe0ff 55%, #0a7ea4);
    box-shadow: 0 0 0 4px #05060d, 0 0 0 6px rgba(63,224,255,.35), 0 0 18px rgba(63,224,255,.55);
  }
  #boot .flip::before {
    content: ""; position: absolute; top: 3px; width: 12px; height: 12px; border-radius: 50%;
    background: #05060d; box-shadow: inset 0 0 0 2px #3fe0ff;
  }
  #boot .flip.l { left: 22px; transform-origin: 9px 9px; transform: rotate(24deg); animation: flipL 1.3s cubic-bezier(.4,0,.3,1) infinite; }
  #boot .flip.l::before { left: 3px; }
  #boot .flip.r { right: 22px; transform-origin: calc(100% - 9px) 9px; transform: rotate(-24deg); animation: flipR 1.3s cubic-bezier(.4,0,.3,1) infinite; }
  #boot .flip.r::before { right: 3px; }
  @keyframes flipL { 0%, 48%, 100% { transform: rotate(24deg); } 58%, 66% { transform: rotate(-14deg); } }
  @keyframes flipR { 0%, 48%, 100% { transform: rotate(-24deg); } 58%, 66% { transform: rotate(14deg); } }
  #boot .ball {
    position: absolute; left: 50%; top: 10px; width: 52px; height: 52px; margin-left: -26px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #fff 0%, #e8f6ff 45%, #b8d8ee 100%);
    border: 7px solid #000; box-sizing: border-box;
    box-shadow: 0 0 34px rgba(63,224,255,.55);
    animation: drop 1.3s cubic-bezier(.45,0,.35,1) infinite;
  }
  @keyframes drop {
    0%   { transform: translateY(-14px) scale(1,1); }
    52%  { transform: translateY(50px)  scale(1.12,.88); }
    64%  { transform: translateY(46px)  scale(.94,1.08); }
    100% { transform: translateY(-14px) scale(1,1); }
  }
  #boot .disp {
    position: relative; z-index: 1; margin-top: 18px; padding: 15px 30px 14px;
    background: #03050a; border: 1px solid rgba(63,224,255,.3);
    box-shadow: inset 0 0 0 2px #000, inset 0 6px 22px rgba(0,0,0,.9), 0 0 26px rgba(63,224,255,.12);
  }
  #boot .disp::before, #boot .disp::after {
    content: ""; position: absolute; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%;
    background: #1c2740; box-shadow: inset 0 0 0 1px rgba(143,232,255,.35);
  }
  #boot .disp::before { left: 5px; } #boot .disp::after { right: 5px; }
  #boot .t {
    font: clamp(21px, 6.9vw, 30px)/1 "Ken Pixel", 'Segoe UI', system-ui, sans-serif; letter-spacing: .12em;
    color: #3fe0ff; text-transform: uppercase; text-shadow: 0 0 12px rgba(63,224,255,.7);
    -webkit-mask: radial-gradient(circle, #000 34%, transparent 42%) 0 0 / 4px 4px;
    mask: radial-gradient(circle, #000 34%, transparent 42%) 0 0 / 4px 4px;
    opacity: 0; transition: opacity .25s;
  }
  #boot.font .t { opacity: 1; }
  #boot .lamps { position: relative; z-index: 1; display: flex; gap: 11px; margin-top: 24px; }
  #boot .lamps i {
    position: relative; width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  }
  #boot .lamps i::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: #ffd24a; box-shadow: 0 0 10px #ffd24a, 0 0 2px #fff;
    opacity: 0; animation: chase 1.3s linear infinite;
  }
  #boot .lamps i:nth-child(2)::after { animation-delay: .13s; }
  #boot .lamps i:nth-child(3)::after { animation-delay: .26s; }
  #boot .lamps i:nth-child(4)::after { animation-delay: .39s; }
  #boot .lamps i:nth-child(5)::after { animation-delay: .52s; }
  #boot .lamps i:nth-child(6)::after { animation-delay: .65s; }
  #boot .lamps i:nth-child(7)::after { animation-delay: .78s; }
  @keyframes chase { 0%, 8% { opacity: 1; } 34%, 100% { opacity: 0; } }
  #boot .s {
    position: relative; z-index: 1; margin-top: 18px; font: 10px/1 "Ken Pixel", 'Segoe UI', system-ui, sans-serif;
    letter-spacing: .16em; color: rgba(143,232,255,.6); text-transform: uppercase;
  }
  @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; } }

  /* Landscape nudge: the game is designed for portrait only. */
  #rotate {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: #05060d; color: #fff; text-align: center; padding: 30px;
  }
  #rotate b { font-size: 17px; letter-spacing: .1em; text-transform: uppercase; }
  #rotate p { color: rgba(255,255,255,.5); font-size: 13px; margin-top: 10px; font-weight: 600; }
  /* Touch devices only: a desktop browser window is landscape by nature and
   * plays the letterboxed table fine, so gating on a coarse pointer keeps the
   * prompt for the phones and tablets it is actually meant for. */
  @media (orientation: landscape) and (pointer: coarse) and (hover: none) {
    #rotate { display: flex; }
  }
</style>
</head>
<body>

<!-- Two stacked canvases. #gl is the WebGL layer (the physical machine: table,
     rails, towers, flippers — see src/scene3d.js). #game is the transparent 2D
     layer on top (balls, FX, HUD, tray). They share one virtual coordinate
     space, so the 2D layer lands exactly on the 3D table surface. -->
<div id="stage"><canvas id="gl"></canvas><canvas id="game"></canvas></div>

<div id="boot">
  <div class="play"><div class="flip l"></div><div class="flip r"></div><div class="ball"></div></div>
  <div class="disp"><div class="t">Megaball</div></div>
  <div class="lamps"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="s" id="bootmsg">Loading</div>
</div>

<div id="rotate">
  <b>Rotate your device</b>
  <p>Megaball is played in portrait.</p>
</div>

<!-- Load order matters: each file attaches one global and may only use the
     earlier ones. No ES modules, so the game also runs straight from file://. -->
<script src="src/util.js"></script>
<script src="src/fonts.js"></script>
<script src="src/assets.js"></script>
<script src="src/audio.js"></script>
<script src="src/fx.js"></script>
<script src="src/physics.js"></script>
<script src="src/board.js"></script>
<script src="src/entities.js"></script>
<script src="src/cards.js"></script>
<script src="src/levels.js"></script>
<!-- three.js (vendor, MIT) as a plain-script global, then the 3D table layer. -->
<script src="src/vendor/three.min.js"></script>
<script src="src/scene3d.js"></script>
<script src="src/globe.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/game.js"></script>

<script>
(function () {
  'use strict';

  /* The one shipped typeface, in the page before anything is laid out. */
  if (window.FONTS && FONTS.inject) FONTS.inject();

  var canvas = document.getElementById('game');
  var glCanvas = document.getElementById('gl');
  /* The 2D layer is transparent so the WebGL machine underneath shows through.
   * If WebGL is unavailable, SCENE3D.init returns false and DRAW falls back to
   * painting the whole table in 2D on this same canvas. */
  var use3D = !!(window.SCENE3D && SCENE3D.init(glCanvas));
  var ctx = canvas.getContext('2d', { alpha: true });
  if (window.DRAW) DRAW.use3D = use3D;
  var boot = document.getElementById('boot');
  var bootmsg = document.getElementById('bootmsg');

  /* ---- input ---------------------------------------------------------- */

  function bindInput() {
    canvas.addEventListener('pointerdown', function (e) {
      /* Pointer capture keeps a flipper held even if the finger slides off the
       * canvas, but setPointerCapture throws for a pointer the browser does
       * not consider active. Losing the whole handler to that would mean dead
       * flippers, so it is strictly best-effort. */
      try {
        if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
      } catch (err) { /* best effort only */ }
      GAME.pointerDown(e.pointerId, e.clientX, e.clientY);
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('pointermove', function (e) {
      GAME.pointerMove(e.pointerId, e.clientX, e.clientY);
    }, { passive: true });

    function up(e) { GAME.pointerUp(e.pointerId); }
    canvas.addEventListener('pointerup', up, { passive: true });
    canvas.addEventListener('pointercancel', up, { passive: true });
    canvas.addEventListener('lostpointercapture', up, { passive: true });

    /* Belt and braces: never leave a flipper stuck down. */
    window.addEventListener('blur', function () { GAME.clearPointers(); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) GAME.clearPointers();
    });

    window.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      if (SFX && SFX.init) SFX.init();
      GAME.keyDown(e.code);
      if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
    });
    window.addEventListener('keyup', function (e) { GAME.keyUp(e.code); });

    window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });
  }

  function resize() {
    DRAW.resize(canvas);
    if (use3D) SCENE3D.resize(DRAW.vp);
  }

  /* ---- loop ------------------------------------------------------------ */

  var last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    /* Clamp dt: a backgrounded tab returning with a 3-second delta would
     * otherwise teleport every ball through the table. */
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    GAME.update(dt);
    DRAW.frame(ctx, GAME.state);
  }

  /* ---- boot ------------------------------------------------------------ */

  function start() {
    UI.init({
      onStartLevel: function (id) {
        UI.showScreen(null);
        GAME.startLevel(id, GAME.progress.loadout);
      }
    });

    resize();
    bindInput();

    if (SFX && SFX.setMuted) SFX.setMuted(!!GAME.progress.muted);
    GAME.state.mode = 'menu';

    /* Warm the machine while the splash is still up: compile every shader,
     * build and upload each level's table, and paint one 2D frame, so the
     * first real frame and every level start are plain draws. The work is
     * spread over animation frames so the splash keeps moving. */
    bootmsg.textContent = 'Powering up';
    var defs = [];
    if (window.LEVELS) {
      if (LEVELS.list) defs = defs.concat(LEVELS.list);
      if (LEVELS.ENDLESS) defs.push(LEVELS.ENDLESS);
    }
    function open() {
      if (window.FX && FX.reset) FX.reset();
      DRAW.frame(ctx, GAME.state);
      if (SFX && SFX.music) SFX.music('menu');
      UI.showScreen('title');
      bootmsg.textContent = 'Ready';
      boot.classList.add('gone');
      setTimeout(function () { boot.style.display = 'none'; }, 500);
      requestAnimationFrame(frame);
    }
    if (use3D && SCENE3D.warm) SCENE3D.warm(defs, open);
    else open();
  }

  /* Assets are decoration layered over procedural drawing, so a failure here
   * must never stop the game — ART.load always calls back. */
  /* Art and the typeface load side by side; the canvas readouts rasterise
   * text through the face on their first frame, so it has to be in by then.
   * A missing font is not fatal: after 1.5 s we start with the fallback. */
  var pending = 2, started = false;
  function ready() {
    if (started) return;
    if (--pending > 0) return;
    started = true;
    bootmsg.textContent = 'Ready';
    start();
  }
  bootmsg.textContent = 'Loading art';
  if (window.ART && ART.load) ART.load(ready); else ready();
  var fontDone = false;
  function fontReady() { if (!fontDone) { fontDone = true; ready(); } }
  if (document.fonts && document.fonts.load) {
    document.fonts.load('16px "Ken Pixel"').then(function () {
      boot.classList.add('font');            // the display lights once the face is in
      fontReady();
    }, fontReady);
    setTimeout(fontReady, 1500);
  } else {
    fontReady();
  }
})();
</script>
</body>
</html>
